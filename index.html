<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home TV</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<style>
  :root {
    --night: #0E1B2E;
    --deep: #162A45;
    --raised: #213A5C;
    --sand: #F2E6CC;
    --dune: #C9B48A;
    --lagoon: #3CC8B4;
    --mist: #8EA2BD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--night); color: var(--sand);
    font-family: "Tajawal", "Segoe UI", Arial, sans-serif; }
  .screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: none; }
  .screen.on { display: block; }

  /* ---------- Home ---------- */
  #home { padding: 5vh 5vw; background:
    radial-gradient(ellipse at 15% 110%, #2A4A6E 0%, rgba(42,74,110,0) 55%), var(--night); }
  .home-wrap { display: flex; height: 100%; }
  .time-col { width: 38%; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 4vh; }
  #clock { font-size: 15vh; font-weight: 800; line-height: .9; letter-spacing: -.02em; }
  #date { font-size: 3.4vh; color: var(--dune); margin-top: 2vh; }
  #weather { font-size: 3vh; color: var(--mist); margin-top: 1vh; }
  .tiles-col { width: 62%; display: flex; flex-direction: column; justify-content: flex-end; padding-left: 3vw; }
  .tiles-col h2 { font-size: 3vh; font-weight: 500; color: var(--mist); margin-bottom: 2vh; }
  #tiles { display: flex; flex-wrap: wrap; margin: -1vh; }
  .tile { width: calc(25% - 2vh); margin: 1vh; height: 20vh; background: var(--deep); border-radius: 1.6vh;
    padding: 2.2vh; display: flex; flex-direction: column; justify-content: space-between;
    border: .4vh solid transparent; transition: transform .15s, border-color .15s, background .15s; }
  .tile .glyph { font-size: 5vh; line-height: 1; }
  .tile .name { font-size: 3vh; font-weight: 700; }
  .tile .sub { font-size: 2vh; color: var(--mist); }
  .tile.focus { border-color: var(--lagoon); background: var(--raised); transform: scale(1.05); }
  .tile.wide { width: calc(50% - 2vh); }

  /* ---------- Player ---------- */
  #player { background: #000; }
  video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; }
  #list { position: absolute; top: 0; left: 0; bottom: 0; width: 34vw; padding: 4vh 2vw;
    background: linear-gradient(90deg, rgba(14,27,46,.97) 70%, rgba(14,27,46,0)); transition: transform .2s; }
  #list.hide { transform: translateX(-100%); }
  #listTitle { font-size: 3.6vh; font-weight: 800; }
  #listCount { font-size: 2.2vh; color: var(--mist); margin: .6vh 0 2.4vh; }
  .row { display: flex; align-items: center; height: 8vh; padding: 0 1.4vw; border-radius: 1.2vh; margin-bottom: .6vh; }
  .row img { width: 6vh; height: 4.5vh; object-fit: contain; margin-right: 1.2vw; }
  .row .ph { width: 6vh; height: 4.5vh; margin-right: 1.2vw; border-radius: .6vh; background: var(--raised);
    display: flex; align-items: center; justify-content: center; font-size: 2vh; color: var(--mist); }
  .row .t { font-size: 2.8vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row.focus { background: var(--lagoon); color: var(--night); }
  .row.playing .t:after { content: "  ●"; color: var(--lagoon); }
  .row.focus.playing .t:after { color: var(--night); }
  #hint { position: absolute; left: 2vw; bottom: 3vh; font-size: 2vh; color: var(--mist); }
  #toast { position: absolute; right: 4vw; top: 5vh; max-width: 46vw; padding: 2vh 2.4vw; border-radius: 1.4vh;
    background: rgba(14,27,46,.92); font-size: 2.6vh; display: none; border-left: .6vh solid var(--lagoon); }
  #nowName { position: absolute; right: 4vw; bottom: 5vh; font-size: 3.4vh; font-weight: 700;
    text-shadow: 0 .3vh 1vh #000; display: none; }
  #spinner { position: absolute; left: 50%; top: 50%; width: 8vh; height: 8vh; margin: -4vh 0 0 -4vh;
    border: .8vh solid rgba(255,255,255,.15); border-top-color: var(--lagoon); border-radius: 50%;
    animation: spin 1s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .tile, #list { transition: none; } }
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="home-wrap">
    <div class="time-col">
      <div id="clock">--:--</div>
      <div id="date"></div>
      <div id="weather">Abu Dhabi</div>
    </div>
    <div class="tiles-col">
      <h2>What do you want to watch?</h2>
      <div id="tiles"></div>
    </div>
  </div>
</section>

<section id="player" class="screen">
  <video id="video" autoplay playsinline></video>
  <div id="spinner"></div>
  <div id="nowName"></div>
  <div id="list">
    <div id="listTitle"></div>
    <div id="listCount"></div>
    <div id="rows"></div>
    <div id="hint">▲▼ choose · OK play · ◀ hide list · Back home</div>
  </div>
  <div id="toast"></div>
</section>

<script>
(function () {
  "use strict";
  var BASE = "https://iptv-org.github.io/iptv/";
  var SOURCES = [
    { id: "my", glyph: "★", name: "My IPTV", sub: "Your subscription", url: null, wide: true },
    { id: "ae", glyph: "🇦🇪", name: "UAE", sub: "Local channels", url: BASE + "countries/ae.m3u" },
    { id: "ara", glyph: "ع", name: "Arabic", sub: "All Arabic", url: BASE + "languages/ara.m3u" },
    { id: "news", glyph: "📰", name: "News", sub: "World news", url: BASE + "categories/news.m3u" },
    { id: "sports", glyph: "⚽", name: "Sports", sub: "Free sports", url: BASE + "categories/sports.m3u" },
    { id: "kids", glyph: "🧸", name: "Kids", sub: "Cartoons", url: BASE + "categories/kids.m3u" },
    { id: "movies", glyph: "🎬", name: "Movies", sub: "Film channels", url: BASE + "categories/movies.m3u" },
    { id: "yt", glyph: "▶", name: "YouTube", sub: "TV version", link: "https://www.youtube.com/tv" }
  ];
  var K = { LEFT: [37], UP: [38], RIGHT: [39], DOWN: [40], OK: [13],
            BACK: [8, 27, 461, 10009, 166], CHUP: [33, 427], CHDN: [34, 428] };
  function is(code, name) { return K[name].indexOf(code) !== -1; }
  function $(id) { return document.getElementById(id); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  // ---- Custom playlist via ?m3u=<url> (pushed by Claude through the TV API) ----
  var q = location.search.match(/[?&]m3u=([^&]+)/);
  if (q) { store("myPlaylist", decodeURIComponent(q[1])); }
  var my = store("myPlaylist");
  SOURCES[0].url = my;
  var tiles = SOURCES.filter(function (s) { return s.id !== "my" || my; });

  // ---- Home ----
  var homeFocus = 0, screen = "home";
  function renderTiles() {
    var html = "";
    for (var i = 0; i < tiles.length; i++) {
      var s = tiles[i];
      html += '<div class="tile' + (s.wide ? " wide" : "") + (i === homeFocus ? " focus" : "") + '">' +
        '<div class="glyph">' + s.glyph + '</div><div><div class="name">' + s.name +
        '</div><div class="sub">' + s.sub + '</div></div></div>';
    }
    $("tiles").innerHTML = html;
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  var DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  var MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  function tick() {
    var d = new Date();
    $("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("date").textContent = DAYS[d.getDay()] + ", " + d.getDate() + " " + MONTHS[d.getMonth()];
  }
  var WX = { 0: "Clear", 1: "Mostly clear", 2: "Partly cloudy", 3: "Cloudy", 45: "Fog", 48: "Fog",
    51: "Drizzle", 53: "Drizzle", 55: "Drizzle", 61: "Rain", 63: "Rain", 65: "Heavy rain", 80: "Showers",
    81: "Showers", 82: "Heavy showers", 95: "Thunderstorm" };
  function weather() {
    var x = new XMLHttpRequest();
    x.open("GET", "https://api.open-meteo.com/v1/forecast?latitude=24.45&longitude=54.38&current=temperature_2m,weather_code&timezone=Asia%2FDubai");
    x.onload = function () {
      try { var c = JSON.parse(x.responseText).current;
        $("weather").textContent = "Abu Dhabi  " + Math.round(c.temperature_2m) + "°C  " + (WX[c.weather_code] || "");
      } catch (e) {}
    };
    x.send();
  }

  // ---- Playlist ----
  var channels = [], listFocus = 0, playingIdx = -1, current = null, hls = null, stallTimer = null, skipped = 0;
  function parseM3U(text) {
    var lines = text.split(/\r?\n/), out = [], meta = null;
    skipped = 0;
    for (var i = 0; i < lines.length; i++) {
      var l = lines[i].trim();
      if (l.indexOf("#EXTINF") === 0) {
        var logo = (l.match(/tvg-logo="([^"]*)"/) || [])[1] || "";
        var name = l.substring(l.lastIndexOf(",") + 1).trim();
        meta = { name: name, logo: logo };
      } else if (l && l.charAt(0) !== "#" && meta) {
        // https page cannot load http streams (mixed content), so keep secure streams only
        if (l.indexOf("https://") === 0) { meta.url = l; out.push(meta); } else { skipped++; }
        meta = null;
      }
    }
    return out;
  }
  function openSource(s) {
    if (s.link) { location.href = s.link; return; }
    current = s; show("player");
    $("listTitle").textContent = s.name;
    $("listCount").textContent = "Loading channels…";
    $("rows").innerHTML = ""; $("list").className = "";
    var x = new XMLHttpRequest();
    x.open("GET", s.url);
    x.onload = function () {
      if (x.status !== 200) { $("listCount").textContent = "Couldn't load this list (error " + x.status + "). Press Back."; return; }
      channels = parseM3U(x.responseText);
      listFocus = 0; playingIdx = -1;
      var last = store("last_" + s.id);
      for (var i = 0; last && i < channels.length; i++) if (channels[i].url === last) { listFocus = i; break; }
      $("listCount").textContent = channels.length + " channels" + (skipped ? " (" + skipped + " unsupported hidden)" : "");
      renderRows();
      if (channels.length) play(listFocus);
    };
    x.onerror = function () { $("listCount").textContent = "No connection to the channel list. Check Wi-Fi, then press Back."; };
    x.send();
  }
  function esc(t) { return t.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function renderRows() {
    var VIS = 9, start = Math.max(0, Math.min(listFocus - 4, channels.length - VIS)), html = "";
    for (var i = start; i < Math.min(channels.length, start + VIS); i++) {
      var c = channels[i];
      html += '<div class="row' + (i === listFocus ? " focus" : "") + (i === playingIdx ? " playing" : "") + '">' +
        (c.logo ? '<img src="' + esc(c.logo) + '" onerror="this.style.visibility=\'hidden\'">' : '<div class="ph">TV</div>') +
        '<div class="t">' + esc(c.name) + '</div></div>';
    }
    $("rows").innerHTML = html;
  }

  // ---- Playback ----
  function toast(msg, ms) {
    var t = $("toast"); t.textContent = msg; t.style.display = "block";
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.style.display = "none"; }, ms || 4000);
  }
  function stop() {
    clearTimeout(stallTimer);
    if (hls) { hls.destroy(); hls = null; }
    var v = $("video"); v.pause(); v.removeAttribute("src"); try { v.load(); } catch (e) {}
  }
  function failed() {
    $("spinner").style.display = "none";
    toast("“" + channels[playingIdx].name + "” isn't broadcasting right now. Choose another channel with ▲▼.", 6000);
    $("list").className = "";
  }
  function play(i) {
    if (i < 0 || i >= channels.length) return;
    stop(); playingIdx = i; renderRows();
    var c = channels[i], v = $("video");
    store("last_" + current.id, c.url);
    $("spinner").style.display = "block";
    $("nowName").textContent = c.name; $("nowName").style.display = "block";
    stallTimer = setTimeout(failed, 15000);
    v.onplaying = function () { clearTimeout(stallTimer); $("spinner").style.display = "none";
      setTimeout(function () { $("nowName").style.display = "none"; }, 3000); };
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls({ maxBufferLength: 20, enableWorker: true });
      hls.on(Hls.Events.ERROR, function (e, d) { if (d.fatal) { clearTimeout(stallTimer); failed(); } });
      hls.loadSource(c.url); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function () { v.play(); });
    } else {
      v.src = c.url; v.onerror = function () { clearTimeout(stallTimer); failed(); }; v.play();
    }
  }

  // ---- Navigation ----
  function show(name) {
    screen = name;
    $("home").className = "screen" + (name === "home" ? " on" : "");
    $("player").className = "screen" + (name === "player" ? " on" : "");
  }
  document.addEventListener("keydown", function (e) {
    var k = e.keyCode, handled = true;
    if (screen === "home") {
      var cols = 4, n = tiles.length;
      if (is(k, "RIGHT")) homeFocus = Math.min(n - 1, homeFocus + 1);
      else if (is(k, "LEFT")) homeFocus = Math.max(0, homeFocus - 1);
      else if (is(k, "DOWN")) homeFocus = Math.min(n - 1, homeFocus + cols);
      else if (is(k, "UP")) homeFocus = Math.max(0, homeFocus - cols);
      else if (is(k, "OK")) { openSource(tiles[homeFocus]); }
      else handled = false;
      if (screen === "home") renderTiles();
    } else {
      var listOpen = $("list").className !== "hide";
      if (is(k, "BACK")) { if (listOpen && playingIdx >= 0) $("list").className = "hide"; else { stop(); show("home"); renderTiles(); } }
      else if (is(k, "CHUP")) { play(Math.min(channels.length - 1, playingIdx + 1)); listFocus = playingIdx; renderRows(); }
      else if (is(k, "CHDN")) { play(Math.max(0, playingIdx - 1)); listFocus = playingIdx; renderRows(); }
      else if (!listOpen) { $("list").className = ""; listFocus = Math.max(0, playingIdx); renderRows(); }
      else if (is(k, "DOWN")) { listFocus = Math.min(channels.length - 1, listFocus + 1); renderRows(); }
      else if (is(k, "UP")) { listFocus = Math.max(0, listFocus - 1); renderRows(); }
      else if (is(k, "OK")) { play(listFocus); $("list").className = "hide"; }
      else if (is(k, "LEFT")) { $("list").className = "hide"; }
      else handled = false;
    }
    if (handled) e.preventDefault();
  });

  renderTiles(); tick(); weather();
  setInterval(tick, 10000); setInterval(weather, 900000);
})();
</script>
</body>
</html>
